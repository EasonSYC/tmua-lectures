name: LaTeX Compile PDF

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    name: Build PDF

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup TeX Live
        uses: EasonSYC/latex-style-setup@main

      - name: Compile PDF - Lecture 1
        uses: EasonSYC/latex-compile-pdf@main
        with:
          job-name: ${{ github.event.repository.name }}-lecture-1
          input-file: lecture-1.tex

      - name: Compile PDF - Lecture 2
        uses: EasonSYC/latex-compile-pdf@main
        with:
          job-name: ${{ github.event.repository.name }}-lecture-2
          input-file: lecture-2.tex

      - name: Compile PDF - Lecture 3
        uses: EasonSYC/latex-compile-pdf@main
        with:
          job-name: ${{ github.event.repository.name }}-lecture-3
          input-file: lecture-3.tex

      - name: Compile PDF - Lecture 4
        uses: EasonSYC/latex-compile-pdf@main
        with:
          job-name: ${{ github.event.repository.name }}-lecture-4
          input-file: lecture-4.tex

      - name: Compile PDF - Lecture 5
        uses: EasonSYC/latex-compile-pdf@main
        with:
          job-name: ${{ github.event.repository.name }}-lecture-5
          input-file: lecture-5.tex

      - name: Compile PDF - Lecture 6
        uses: EasonSYC/latex-compile-pdf@main
        with:
          job-name: ${{ github.event.repository.name }}-lecture-6
          input-file: lecture-6.tex